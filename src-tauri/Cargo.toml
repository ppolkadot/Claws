[package]
name = "claws"
version = "1.0.9"
description = "Local video downloader with a liquid-glass interface"
edition = "2021"
rust-version = "1.85"
default-run = "claws"

[lib]
name = "claws_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Builds the yt-dlp stand-in used by process tests. Never part of a release build.
test-tools = []

[[bin]]
name = "claws"
path = "src/main.rs"

[[bin]]
name = "claws-fixture-tool"
path = "tools/claws-fixture-tool.rs"
required-features = ["test-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
# Canonicalize downloaded locations before preparing Windows Shell parsing names.
dunce = "1.0.5"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["process", "sync", "io-util", "time", "macros", "rt-multi-thread", "fs"] }
url = "2.5.8"
uuid = { version = "1.20.0", features = ["v4"] }
which = "8.0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2"

[dev-dependencies]
# A mock app handle, so lifecycle tests drive the real downloader functions.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices"] }
windows-core = "=0.61.2"

